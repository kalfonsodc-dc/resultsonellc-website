<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 788" role="img" aria-labelledby="aiStrategyTitle">
  <title id="aiStrategyTitle">Presenter showing an AI strategy dashboard to colleagues in a meeting</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e9f7"/>
      <stop offset="1" stop-color="#e6dbf0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f79"/>
      <stop offset="1" stop-color="#1f4a52"/>
    </linearGradient>
  </defs>

  <rect width="940" height="788" fill="url(#bg)"/>

  <!-- table -->
  <rect x="0" y="620" width="940" height="168" fill="#c9a97e"/>
  <rect x="0" y="620" width="940" height="14" fill="#b6905f"/>

  <!-- screen stand -->
  <rect x="452" y="470" width="16" height="90" fill="#3a3a3a"/>
  <rect x="410" y="558" width="100" height="14" rx="4" fill="#3a3a3a"/>

  <!-- screen -->
  <rect x="330" y="90" width="360" height="392" rx="10" fill="#16232a"/>
  <rect x="350" y="110" width="320" height="352" rx="4" fill="url(#screen)"/>

  <text x="374" y="160" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">AI STRATEGY</text>

  <!-- panel 1: AI brain icon -->
  <rect x="368" y="184" width="88" height="110" rx="8" fill="#ffffff"/>
  <circle cx="412" cy="222" r="26" fill="none" stroke="#783096" stroke-width="5"/>
  <path d="M412 200v44M394 210l36 24M430 210l-36 24" stroke="#71d3dd" stroke-width="4" stroke-linecap="round"/>
  <text x="412" y="278" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#783096" text-anchor="middle">AI</text>

  <!-- panel 2: analytics -->
  <rect x="466" y="184" width="88" height="110" rx="8" fill="#ffffff"/>
  <polyline points="476,262 492,240 508,252 524,222 540,232" fill="none" stroke="#783096" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="476,270 492,258 508,266 524,248 540,254" fill="none" stroke="#71d3dd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- panel 3: readiness / modules -->
  <rect x="564" y="184" width="88" height="110" rx="8" fill="#ffffff"/>
  <rect x="576" y="200" width="64" height="8" rx="4" fill="#783096"/>
  <rect x="576" y="222" width="64" height="8" rx="4" fill="#d8c3e6"/>
  <rect x="576" y="244" width="64" height="8" rx="4" fill="#d8c3e6"/>
  <rect x="576" y="266" width="64" height="8" rx="4" fill="#d8c3e6"/>

  <!-- caption bar -->
  <rect x="368" y="312" width="284" height="120" rx="6" fill="#ffffff" opacity="0.92"/>
  <rect x="384" y="330" width="180" height="10" rx="5" fill="#783096"/>
  <rect x="384" y="352" width="252" height="8" rx="4" fill="#c7c7c7"/>
  <rect x="384" y="368" width="230" height="8" rx="4" fill="#c7c7c7"/>
  <rect x="384" y="384" width="240" height="8" rx="4" fill="#c7c7c7"/>
  <rect x="384" y="404" width="120" height="10" rx="5" fill="#71d3dd"/>

  <!-- presenter figure -->
  <g>
    <circle cx="300" cy="330" r="42" fill="#8a5a3b"/>
    <path d="M262 322c4-30 30-46 38-46s34 16 38 46c-6 20-70 20-76 0Z" fill="#2b2b2b"/>
    <rect x="272" y="368" width="56" height="120" rx="20" fill="#e7c9a3"/>
    <path d="M300 388c30 6 58 30 66 70l-16 6c-10-34-30-52-50-58Z" fill="#e7c9a3"/>
    <rect x="252" y="480" width="96" height="160" rx="18" fill="#d8c3e6"/>
  </g>

  <!-- seated colleagues silhouettes around table -->
  <g fill="#5b4636">
    <circle cx="120" cy="470" r="34"/>
    <rect x="86" y="500" width="68" height="130" rx="18"/>
  </g>
  <g fill="#7a5a44">
    <circle cx="800" cy="480" r="34"/>
    <rect x="766" y="510" width="68" height="130" rx="18"/>
  </g>
  <g fill="#3f3f3f" opacity="0.85">
    <circle cx="470" cy="560" r="30"/>
    <rect x="440" y="586" width="60" height="110" rx="16"/>
  </g>

  <!-- laptop on table -->
  <rect x="418" y="590" width="90" height="60" rx="4" fill="#2b2b2b"/>
  <rect x="424" y="596" width="78" height="46" rx="2" fill="#8fd6dc"/>
  <rect x="410" y="650" width="106" height="8" rx="4" fill="#1a1a1a"/>

  <!-- coffee cup -->
  <rect x="540" y="628" width="30" height="34" rx="6" fill="#ffffff"/>
  <rect x="540" y="618" width="30" height="12" rx="6" fill="#3a3a3a"/>
</svg>
